[package]
name = "ports-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
authors = ["nuky <svenvowe@gmail.com>"]
description = "A minimal CLI tool to list open ports and associated processes."
keywords = ["cli", "network", "port", "process", "netstat"]
categories = ["command-line-utilities", "network-programming"]
repository = "https://github.com/nuclearglow/ports-cli"
readme = "README.md"
license = "MIT"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "ports"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
comfy-table = "8"
netstat2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system", "user"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
